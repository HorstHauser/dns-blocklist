name: Build DNS blocklist

on:
  schedule:
    # Täglich 03:17 UTC (04:17 Europe/Berlin im Winter, 05:17 im Sommer)
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blocklist
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt stats.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen an blocklist.txt oder stats.json."
          else
            git commit -m "Aktualisiere Sperrliste $(date -u +%Y-%m-%d)"
            git push
          fi
